<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Eligibility Checker</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <section class="form-page">

        <div class="form-container">

            <h1>Loan Eligibility Checker</h1>

            <p>
                Enter applicant information and predict loan approval.
            </p>

            <form action="/predict" method="POST">

                <div class="form-grid">

                    <div class="input-group">
                        <label>Gender</label>
                        <select name="Gender">
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Married</label>
                        <select name="Married">
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Dependents</label>
                        <input type="number" name="Dependents" required>
                    </div>

                    <div class="input-group">
                        <label>Education</label>
                        <select name="Education">
                            <option value="0">Graduate</option>
                            <option value="1">Not Graduate</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Self Employed</label>
                        <select name="Self_Employed">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Applicant Income</label>
                        <input
type="number"
name="ApplicantIncome"
min="0"
required>
                    </div>

                    <div class="input-group">
                        <label>Coapplicant Income</label>
<input
type="number"
name="CoapplicantIncome"
min="0"
required>                    </div>

                    <div class="input-group">
                        <label>Loan Amount</label>
                       <input
type="number"
name="LoanAmount"
min="1"
required>
                    </div>

                    <div class="input-group">
                        <label>Loan Amount Term</label>
<input
type="number"
name="Loan_Amount_Term"
min="12"
required>
                    </div>

                    <div class="input-group">
                        <label>Credit History</label>
                        <select name="Credit_History">
                            <option value="1">Good</option>
                            <option value="0">Bad</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Property Area</label>
                        <select name="Property_Area">
                            <option value="0">Rural</option>
                            <option value="1">Semiurban</option>
                            <option value="2">Urban</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="predict-btn">
                    Predict Loan Approval
                </button>

            </form>

        </div>

    </section>

</body>

</html>
